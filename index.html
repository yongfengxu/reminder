<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #1e293b; border-radius: 1rem; padding: 2rem; max-width: 480px; width: 100%; text-align: center; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #38bdf8; }

  #quote-zh { font-size: 1rem; line-height: 1.6; color: #94a3b8; margin-top: .5rem; transition: opacity .4s; }
  #water-reminder { font-size: 1.1rem; padding: 1.5rem; animation: none; }
  #water-reminder.active { animation: pulse 1s ease-in-out 3; background: #164e63; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .timer { margin-top: 1rem; font-size: .85rem; color: #64748b; }
  .emoji { font-size: 2rem; margin-bottom: .5rem; }
  #source { font-size: .7rem; color: #334155; margin-top: .3rem; letter-spacing: .05em; }
  #notif-btn { margin-top: 1rem; padding: .5rem 1.2rem; border: 1px solid #334155; background: transparent; color: #94a3b8; border-radius: .5rem; cursor: pointer; font-size: .85rem; }

  <div class="timer">Auto-refreshes every 20s · Next in <span id="quote-countdown">0:20</span></div>

let shuffled = [], si = 0;
function shuffle() {
  shuffled = [...quotes];
  for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
  si = 0;
}
shuffle();
let waterSec = 3600, quoteSec = 20;

async function translateToZh(text) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh`, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw 0;
    const data = await res.json();
    return data.responseData.translatedText;
  } catch { return ""; }
}

async function showQuote() {
  const el = document.getElementById("quote");
  const elZh = document.getElementById("quote-zh");
  const src = document.getElementById("source");
  let en, zh, from;
  try {
    const res = await fetch("https://dummyjson.com/quotes/random", { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw 0;
    const data = await res.json();
    en = `${data.quote} — ${data.author}`;
    zh = await translateToZh(data.quote);
    from = "via dummyjson.com API";
  } catch {
    if (si >= shuffled.length) shuffle();
    const q = shuffled[si++];
    en = q.en; zh = q.zh;
    from = "via built-in quotes";
  }
  el.style.opacity = 0; elZh.style.opacity = 0; src.style.opacity = 0;
  setTimeout(() => {
    el.textContent = en;
    elZh.textContent = zh;
    src.textContent = from;
    el.style.opacity = 1; elZh.style.opacity = 1; src.style.opacity = 1;
  }, 400);
}

function notify(title, body) {
  if (Notification.permission === "granted") new Notification(title, { body });
}

function waterAlert() {
  const el = document.getElementById("water-reminder");
  el.classList.remove("active");
  void el.offsetWidth;
  el.classList.add("active");
  notify("💧 Hydration Reminder", "Time to drink water and take a break!");
}

function fmt(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function tick() {
  waterSec--; quoteSec--;
  if (waterSec <= 0) { waterAlert(); waterSec = 3600; }
  if (quoteSec <= 0) { showQuote(); quoteSec = 20; }
  document.getElementById("water-countdown").textContent = fmt(waterSec);
  document.getElementById("quote-countdown").textContent = fmt(quoteSec);
}

function requestNotif() {
  if ("Notification" in window) Notification.requestPermission();
}

showQuote();
setInterval(tick, 1000);
</script>
